<style>
body{margin:0}
.a{position:absolute}
.rec{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#2A272C 0%,#141216 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.lab{position:absolute;border-radius:50%;background:#E9A24A}
.chrome{background:linear-gradient(90deg,#6E6A66 0%,#D6D1CA 30%,#8E8984 60%,#5A5652 100%)}
.lab{display:none}
.rec{background:none !important;box-shadow:none !important;overflow:visible}
.rec::before{content:'';position:absolute;left:0;top:50%;width:100%;aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,#14110F 0,#14110F 2.2%,rgba(0,0,0,0) 2.6%),
    linear-gradient(#2A1B38,#2A1B38) 60% 45% / 13% 3.5% no-repeat,
    linear-gradient(#2A1B38,#2A1B38) 38% 58% / 7% 2.5% no-repeat,
    radial-gradient(circle at 50% 50%,#E9A24A 0,#E9A24A 16%,#1C1A1F 16.6%,#1C1A1F 18%,rgba(0,0,0,0) 18.4%),
    repeating-radial-gradient(circle at 50% 50%,#141216 0px,#141216 1px,#24212A 1px,#24212A 3px);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);
  transform:translateY(-50%) scaleY(.11) rotate(0deg);
  animation:mz-spin 1.8s linear infinite}
@keyframes mz-spin{from{transform:translateY(-50%) scaleY(.11) rotate(0deg)}to{transform:translateY(-50%) scaleY(.11) rotate(360deg)}}
.uplab{background:
    linear-gradient(#2A1B38,#2A1B38) 64% 38% / 26% 9% no-repeat,
    linear-gradient(#2A1B38,#2A1B38) 30% 66% / 16% 7% no-repeat,
    #E9A24A !important;animation:mz-turn 1.8s linear infinite}
@keyframes mz-turn{to{transform:rotate(360deg)}}
.paused .rec::before,.paused .uplab{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.rec::before,.uplab{animation:none}}
</style>
</helmet>

class Component extends DCLogic {
  renderVals() {
    const m = this.props.model || 'standard';
    const ids = ['standard', 'console', 'deck', 'clear', 'suitcase', 'broadcast', 'horn', 'linear', 'upright', 'slate', 'radiogram', 'lathe'];
    const is = {};
    ids.forEach((id) => { is[id] = id === m; });
