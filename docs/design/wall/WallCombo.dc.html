.wx-cap{position:absolute;top:350px;width:104px;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}

<script type="text/x-dc" data-dc-script data-props='{"finish":{"editor":"enum","options":["walnut","oak","teak","ash","black"],"default":"walnut"},"$preview":{"width":342,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const F = {
      walnut: { base: '#5A3A24', hi: '#6E4A30', lo: '#46301E', line: 'rgba(28,14,6,.45)', line2: 'rgba(140,96,60,.28)', back: '#2E1D11', top: '#7C5838' },
      oak:    { base: '#B8894F', hi: '#CC9F63', lo: '#9F7340', line: 'rgba(96,60,24,.34)', line2: 'rgba(240,200,140,.30)', back: '#6E4C24', top: '#D7AE73' },
      teak:   { base: '#8F5A2E', hi: '#A66B38', lo: '#784A24', line: 'rgba(56,28,8,.40)', line2: 'rgba(210,140,80,.24)', back: '#4E3016', top: '#B57A45' },
      ash:    { base: '#D8C6A4', hi: '#E7D8BA', lo: '#C6B28C', line: 'rgba(130,104,70,.32)', line2: 'rgba(255,248,230,.40)', back: '#8C7A58', top: '#EEE2C8' },
      black:  { base: '#2B2623', hi: '#37312D', lo: '#211D1B', line: 'rgba(0,0,0,.50)', line2: 'rgba(120,104,92,.26)', back: '#151210', top: '#3F3833' }
    };
    const f = F[this.props.finish] || F.walnut;
    const fig = 'linear-gradient(90deg, rgba(0,0,0,.07) 0%, rgba(255,255,255,.05) 21%, rgba(0,0,0,.05) 46%, rgba(255,255,255,.06) 69%, rgba(0,0,0,.07) 100%)';
    const figV = 'linear-gradient(0deg, rgba(0,0,0,.07) 0%, rgba(255,255,255,.05) 27%, rgba(0,0,0,.05) 52%, rgba(255,255,255,.06) 77%, rgba(0,0,0,.07) 100%)';
    const lines = (a, b, l1, l2, p1, p2) => 'repeating-linear-gradient(' + a + 'deg, ' + l1 + ' 0px, ' + l1 + ' 1px, transparent 1px, transparent ' + p1 + 'px), repeating-linear-gradient(' + b + 'deg, ' + l2 + ' 0px, ' + l2 + ' 1px, transparent 1px, transparent ' + p2 + 'px)';
    return {
      w: {
        rail: lines(179, 181.5, f.line, f.line2, 5, 11) + ', ' + fig + ', linear-gradient(180deg, ' + f.hi + ' 0%, ' + f.base + ' 50%, ' + f.lo + ' 100%)',
        post: lines(89, 91.5, f.line, f.line2, 5, 11) + ', ' + figV + ', linear-gradient(90deg, ' + f.hi + ' 0%, ' + f.base + ' 50%, ' + f.lo + ' 100%)',
        top: lines(179.5, 180.7, f.line, f.line2, 3, 7) + ', linear-gradient(180deg, ' + f.lo + ' 0%, ' + f.top + ' 100%)',
        back: lines(90.6, 89.2, 'rgba(0,0,0,.22)', 'rgba(255,255,255,.04)', 7, 13) + ', ' + f.back
      }
    };
  }
}
</script>
