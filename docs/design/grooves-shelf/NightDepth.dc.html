<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sundown — night depth and pitch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&amp;family=Archivo:wght@400;500;600;700&amp;family=Caveat:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:#EFE9DF}
a{color:#EFE9DF}a:hover{color:#FFFFFF}
.seg{flex:1;min-height:48px;border:0;font-family:'Archivo',sans-serif;font-size:16px;cursor:pointer}
.seg-on{background:#EFE9DF;color:#14110F}
.seg-off{background:none;color:#ABA298}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0E0B0C">
  <div style="position: absolute; top: 48px; left: 0; right: 0; bottom: 0; border-radius: 24px 24px 0 0; background: #221D21; padding: 10px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: rgba(239,233,223,.22)"></span>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <div role="tablist" style="display: flex; border: 1px solid rgba(239,233,223,.28); border-radius: 8px; overflow: hidden">
        <button role="tab" aria-selected="true" style="min-height: 44px; padding: 0 18px; border: 0; background: #EFE9DF; color: #14110F; font-family: 'Archivo', sans-serif; font-size: 16px">Day</button>
        <button role="tab" aria-selected="false" style="min-height: 44px; padding: 0 18px; border: 0; background: none; color: #ABA298; font-family: 'Archivo', sans-serif; font-size: 16px">Sound</button>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; background: none; border: 0; color: #EFE9DF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2 2 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-family: 'Antonio', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -.015em">Night</h2>
      <p style="margin: 0; font-size: 14px; color: #ABA298">After sunset the platter slows. It returns to speed from solar midnight. Vinyl only.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 16px">How deep the night goes</span>
      <div style="display: flex; border: 1px solid rgba(239,233,223,.28); border-radius: 8px; overflow: hidden">
        <sc-for list="{{depths}}" as="d" hint-placeholder-count="4">
          <sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}">
            <button class="seg seg-on" onClick="{{d.pick}}">{{d.name}}</button>
          </sc-if>
          <sc-if value="{{d.off}}" hint-placeholder-val="{{ true }}">
            <button class="seg seg-off" onClick="{{d.pick}}">{{d.name}}</button>
          </sc-if>
        </sc-for>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9A9187">{{depthLine}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 16px">At night, the music</span>
      <div style="display: flex; border: 1px solid rgba(239,233,223,.28); border-radius: 8px; overflow: hidden">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <sc-if value="{{m.on}}" hint-placeholder-val="{{ false }}">
            <button class="seg seg-on" onClick="{{m.pick}}">{{m.name}}</button>
          </sc-if>
          <sc-if value="{{m.off}}" hint-placeholder-val="{{ true }}">
            <button class="seg seg-off" onClick="{{m.pick}}">{{m.name}}</button>
          </sc-if>
        </sc-for>
      </div>
      <span style="font-size: 14px; color: #ABA298">{{modeLine}}</span>
    </div>

    <div style="border-top: 1px solid rgba(239,233,223,.14); padding-top: 16px; display: flex; align-items: center; gap: 12px">
      <svg width="26" height="16" viewBox="0 0 26 16" aria-hidden="true"><path d="M5 13a8 8 0 0 1 16 0" fill="none" stroke="#E9A24A" stroke-width="2"></path><path d="M1 15h24" stroke="#E9A24A" stroke-width="2" stroke-linecap="round"></path></svg>
      <span style="font-size: 14px; color: rgba(239,233,223,.85)">On the player:</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #ABA298; border: 1px solid rgba(239,233,223,.18); border-radius: 999px; padding: 2px 8px">{{markLabel}}</span>
    </div>

    <button style="align-self: flex-start; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid rgba(239,233,223,.35); background: none; color: #EFE9DF; font-family: 'Archivo', sans-serif; font-size: 16px">Hear it at true speed</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { depth: 1, mode: 0 };
  }
  renderVals() {
    const D = [
      { name: 'Gentle', rate: 0.85 },
      { name: 'Medium', rate: 0.80 },
      { name: 'Deep', rate: 0.75 },
      { name: 'Deepest', rate: 0.70 }
    ];
    const M = ['Slowed', 'Keep pitch'];
    const cur = D[this.state.depth];
    const semis = Math.abs(12 * Math.log2(cur.rate)).toFixed(1);
    const slowed = this.state.mode === 0;
    return {
      depths: D.map((d, i) => ({
        name: d.name,
        on: i === this.state.depth,
        off: i !== this.state.depth,
        pick: () => this.setState({ depth: i })
      })),
      modes: M.map((name, i) => ({
        name,
        on: i === this.state.mode,
        off: i !== this.state.mode,
        pick: () => this.setState({ mode: i })
      })),
      depthLine: cur.rate.toFixed(2) + '× by midnight · ' + (slowed ? semis + ' semitones lower' : 'pitch unchanged'),
      modeLine: slowed
        ? 'Slows with the platter, so it also sounds lower.'
        : 'The platter slows. The record plays at its true speed and pitch, with a little more air.',
      markLabel: slowed ? 'slowed' : 'true pitch'
    };
  }
}
</script>
</body>
</html>
