<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player — grooves drawn from the audio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&amp;family=Archivo:wght@400;500;600;700&amp;family=Caveat:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:#EFE9DF}
a{color:#EFE9DF}a:hover{color:#FFFFFF}
.g-loud{background:repeating-radial-gradient(circle at 50% 50%,#17151A 0px,#17151A 1px,#24212A 1px,#24212A 2px)}
.g-mid{background:repeating-radial-gradient(circle at 50% 50%,#1A181D 0px,#1A181D 1px,#26232A 1px,#26232A 3px)}
.g-quiet{background:repeating-radial-gradient(circle at 50% 50%,#1D1B20 0px,#1D1B20 1px,#29262D 1px,#29262D 4.5px)}
.gap{box-shadow:0 0 0 1.5px #34303A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: linear-gradient(170deg, #3B2B33 0%, #1F171A 55%, #0E0B0C 100%); font-family: 'Archivo', system-ui, sans-serif">

  <div style="position: absolute; top: 28px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #ABA298">Side A</span>
    <button aria-label="More" style="background: none; border: 0; padding: 10px; margin: -10px; color: #ABA298; display: flex">
      <svg width="22" height="6" viewBox="0 0 22 6" aria-hidden="true"><circle cx="3" cy="3" r="2" fill="currentColor"></circle><circle cx="11" cy="3" r="2" fill="currentColor"></circle><circle cx="19" cy="3" r="2" fill="currentColor"></circle></svg>
    </button>
  </div>

  <div style="position: absolute; top: 74px; left: 25px; width: 340px; height: 340px; border-radius: 50%; box-shadow: 0 2px 4px rgba(0,0,0,.45), 0 16px 36px rgba(0,0,0,.45)">
    <div class="g-quiet" style="position: absolute; inset: 0; border-radius: 50%"></div>
    <div class="g-mid gap" style="position: absolute; inset: 8px; border-radius: 50%"></div>
    <div class="g-loud gap" style="position: absolute; inset: 27px; border-radius: 50%"></div>
    <div class="g-quiet gap" style="position: absolute; inset: 50px; border-radius: 50%"></div>
    <div class="g-mid gap" style="position: absolute; inset: 67px; border-radius: 50%"></div>
    <div class="g-loud gap" style="position: absolute; inset: 85px; border-radius: 50%"></div>
    <div style="position: absolute; inset: 101px; border-radius: 50%; background: radial-gradient(circle, #1C1A1F 0%, #222026 100%); box-shadow: 0 0 0 1.5px #34303A"></div>
    <div style="position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(118deg, rgba(232,176,160,0) 38%, rgba(232,176,160,.13) 47%, rgba(232,176,160,.04) 52%, rgba(232,176,160,0) 58%)"></div>
    <div style="position: absolute; inset: 38px; border-radius: 50%; border: 1px solid rgba(239,233,223,.42)"></div>
    <div style="position: absolute; top: 34px; left: 165px; width: 10px; height: 10px; border-radius: 50%; background: #EFE9DF; box-shadow: 0 0 0 3px rgba(239,233,223,.18)"></div>
    <div style="position: absolute; inset: 112px; border-radius: 50%; background: #E9A24A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .08em; color: #2A1B38">KLP-019 · SIDE A</span>
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #14110F"></span>
      <span style="font-family: 'Antonio', sans-serif; font-weight: 700; font-size: 15px; color: #2A1B38">Harbor Lights</span>
    </div>
  </div>

  <div style="position: absolute; top: 442px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Antonio', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -.015em">Harbor Lights</h1>
    <p style="margin: 0; font-size: 16px; color: rgba(239,233,223,.85)">Ines Okafor</p>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #26202C; background: #EFE6D2; padding: 4px 8px; transform: rotate(-1.5deg); box-shadow: 0 1px 2px rgba(0,0,0,.4)">12″ · 33⅓</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #ABA298">FLAC 24/96</span>
    </div>
  </div>

  <div style="position: absolute; top: 596px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px">
    <div role="img" aria-label="Side A, track 2 of 5, about halfway through" style="display: flex; gap: 4px; height: 4px">
      <span style="flex: 18; border-radius: 2px; background: rgba(239,233,223,.85)"></span>
      <span style="flex: 22; border-radius: 2px; background: linear-gradient(90deg, rgba(239,233,223,.85) 0%, rgba(239,233,223,.85) 48%, rgba(239,233,223,.16) 48%)"></span>
      <span style="flex: 16; border-radius: 2px; background: rgba(239,233,223,.16)"></span>
      <span style="flex: 17; border-radius: 2px; background: rgba(239,233,223,.16)"></span>
      <span style="flex: 15; border-radius: 2px; background: rgba(239,233,223,.16)"></span>
    </div>
    <span style="font-size: 14px; color: #ABA298">2 · Night Ferry</span>
  </div>

  <div style="position: absolute; top: 664px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 56px">
    <button aria-label="Lift to previous track" style="width: 48px; height: 48px; background: none; border: 0; color: #EFE9DF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 3v16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path><path d="M19 3 7 11l12 8z" fill="currentColor"></path></svg>
    </button>
    <button aria-label="Pause" style="width: 64px; height: 64px; border-radius: 50%; background: none; border: 1.5px solid #EFE9DF; color: #EFE9DF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="2" y="1" width="4.5" height="18" rx="1" fill="currentColor"></rect><rect x="11.5" y="1" width="4.5" height="18" rx="1" fill="currentColor"></rect></svg>
    </button>
    <button aria-label="Lift to next track" style="width: 48px; height: 48px; background: none; border: 0; color: #EFE9DF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M18 3v16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path><path d="M3 3l12 8-12 8z" fill="currentColor"></path></svg>
    </button>
  </div>

  <div style="position: absolute; bottom: 28px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Sundown: dusk, slowed" style="display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 8px 0; color: #E9A24A; font-family: 'Archivo', sans-serif; font-size: 16px">
      <svg width="26" height="16" viewBox="0 0 26 16" aria-hidden="true"><path d="M5 13a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2"></path><path d="M1 15h24M13 1v2M3.5 5l1.5 1.5M22.5 5 21 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      <span>Dusk</span>
      <sc-if value="{{showSlowed}}" hint-placeholder-val="{{ true }}">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #ABA298; border: 1px solid rgba(239,233,223,.18); border-radius: 999px; padding: 2px 8px">slowed</span>
      </sc-if>
    </button>
    <button aria-label="Queue" style="width: 44px; height: 44px; background: none; border: 0; color: #ABA298; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="20" viewBox="0 0 24 20" aria-hidden="true"><path d="M2 3h14M2 9h14M2 15h8M18 12v7M14.5 15.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showSlowed":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { showSlowed: this.props.showSlowed ?? true };
  }
}
</script>
</body>
</html>
