<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crate hold card with hook preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Archivo:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.disp{font-family:'Antonio','Arial Narrow',sans-serif}
.act{min-height:48px;width:100%;padding:0 16px;border:0;border-top:1px solid rgba(239,233,223,.10);background:transparent;color:#EFE9DF;font-family:'Archivo',sans-serif;font-size:15px;text-align:left;display:flex;align-items:center;gap:12px}
a{color:#FF9E2C}a:hover{color:#FFB85E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #352A24 0%, #1A1310 62%, #0D0B10 100%); color: #EFE9DF; font-family: 'Archivo', 'Helvetica Neue', sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; left: 50%; top: 150px; width: 266px; height: 40px; margin-left: -133px; border-radius: 4px 4px 0 0; background: #4E4E62; transform: perspective(900px) rotateX(60deg); transform-origin: bottom; opacity: .5"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; bottom: 120px; width: 330px; height: 118px; margin-left: -165px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #3A2B22 0%, #1E1612 100%); opacity: .6"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,6,8,.55)"></div>

<div role="img" aria-label="The held record, lifted out of the bin, its disc peeking from the sleeve" style="position: absolute; left: 50%; top: 92px; width: 200px; height: 200px; margin-left: -100px; transform: rotate(-2deg)">
<span aria-hidden="true" style="position: absolute; right: -36px; top: 22px; width: 156px; height: 156px; border-radius: 50%; background: repeating-radial-gradient(circle, #121216 0px, #121216 1px, #1C1D23 1px, #1C1D23 2.4px); box-shadow: 0 8px 18px rgba(0,0,0,.5); display: block"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 4px; background: #5A4A5E; box-shadow: inset 0 1px 0 rgba(255,235,200,.22), 0 24px 48px rgba(0,0,0,.6); display: block"></span>
</div>

<div role="menu" aria-label="[Artist] — [Album]" style="position: absolute; left: 16px; right: 16px; top: 324px; border-radius: 12px; background: #1E1714; box-shadow: 0 16px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,235,200,.08); overflow: hidden">
<p class="disp" style="margin: 0; padding: 16px 16px 12px; font-size: 18px; font-weight: 700; letter-spacing: .02em">[Artist] — [Album]</p>

<div style="padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px">
<button role="menuitem" aria-label="Stop preview" style="min-height: 52px; width: 100%; padding: 0 14px; border: 1px solid rgba(255,158,44,.45); border-radius: 10px; background: rgba(255,158,44,.12); color: #FFB85E; display: flex; align-items: center; gap: 12px; text-align: left">
<span aria-hidden="true" style="width: 32px; height: 32px; flex: 0 0 auto; border-radius: 16px; background: #FF9E2C; color: #170D04; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="1"></rect></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto">
<span style="font-family: 'Archivo', sans-serif; font-size: 15px; font-weight: 600; color: #EFE9DF">Previewing the hook</span>
<span class="mono" style="font-size: 10px; letter-spacing: .08em; color: #FFB85E">FROM [TRACK] · 1:02–1:24</span>
</span>
<svg width="36" height="20" viewBox="0 0 36 20" aria-hidden="true"><rect x="0" y="7" width="3" height="6" rx="1" fill="#FFB85E"></rect><rect x="6" y="3" width="3" height="14" rx="1" fill="#FFB85E"></rect><rect x="12" y="5" width="3" height="10" rx="1" fill="#FFB85E"></rect><rect x="18" y="1" width="3" height="18" rx="1" fill="#FFB85E"></rect><rect x="24" y="6" width="3" height="8" rx="1" fill="#FFB85E"></rect><rect x="30" y="4" width="3" height="12" rx="1" fill="#FFB85E"></rect></svg>
</button>
<div aria-hidden="true" style="height: 3px; border-radius: 2px; background: rgba(239,233,223,.12); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 34%; border-radius: 2px; background: #FF9E2C; display: block"></span></div>
</div>

<button role="menuitem" class="act">Play next</button>
<button role="menuitem" class="act">Add to queue</button>
<button role="menuitem" class="act">Pin to staff picks</button>
<button role="menuitem" class="act">Sleeve note</button>
</div>

<p style="position: absolute; left: 24px; right: 24px; bottom: 40px; margin: 0; font-size: 13px; line-height: 1.45; color: #A99C8F; text-align: center">The hook is the most repeated stretch of the album’s most-played track. Previews never count as a play.</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
