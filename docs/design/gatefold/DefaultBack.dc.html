<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gatefold — default back cover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Antonio';src:url(/_blob/585dc45325db4fb5854071db9c78a376) format('woff2');font-weight:100 700}
@font-face{font-family:'Archivo';src:url(/_blob/8743631767b0a108de8776ce76e98669) format('woff2');font-weight:100 900}
@font-face{font-family:'IBM Plex Mono';src:url(/_blob/e5237619c7e70707876918173b2492b7) format('woff2');font-weight:400}
@font-face{font-family:'IBM Plex Mono';src:url(/_blob/4645d2e22e61db32e265c0d7172062d1) format('woff2');font-weight:500}
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;font-size:16px;font-weight:500}
.opt svg{width:20px;height:20px;flex:0 0 auto}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: linear-gradient(170deg,#1D2F38 0%,#101A20 62%,#07080C 100%); font-family: 'Archivo', sans-serif; color: #EFE9DF">

  <button style="position: absolute; left: 16px; top: 54px; font-size: 14px; font-weight: 500; padding: 6px 4px; min-height: 44px" aria-label="Back to crate">‹ Crate</button>

  <!-- the default back, at 350px -->
  <div style="position: absolute; left: 20px; top: 104px; width: 350px; height: 350px; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.45)">
    <div style="width: 600px; height: 600px; transform: scale(.583333); transform-origin: 0 0">
      <dc-import name="DefaultBackArt" hint-size="600px,600px"></dc-import>
    </div>
  </div>
  <!-- the back's own menu -->
  <button style="position: absolute; left: 318px; top: 410px; width: 44px; height: 36px; border-radius: 18px; background: rgba(12,10,9,.55); display: flex; align-items: center; justify-content: center" aria-label="Back cover options" aria-expanded="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18" cy="12" r="1.6"></circle></svg>
  </button>

  <div style="position: absolute; left: 0; right: 0; top: 466px; display: flex; justify-content: center; gap: 8px" aria-label="Sleeve side">
    <span style="width: 6px; height: 6px; border-radius: 50%; background: rgba(239,233,223,.3)"></span>
    <span style="width: 6px; height: 6px; border-radius: 50%; background: #EFE9DF"></span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 494px">
    <h3 style="margin: 0; font-family: 'Antonio', sans-serif; font-size: 20px; font-weight: 600">Low Tide Hymnal</h3>
    <p style="margin: 2px 0; font-size: 14px; color: #ABA298">The Marram Grass · 2024</p>
  </div>

  <!-- popover from the back's menu -->
  <div role="menu" aria-label="Back cover" style="position: absolute; left: 20px; right: 20px; top: 556px; background: #2A2522; border-radius: 12px; padding: 8px 18px 14px; box-shadow: 0 2px 4px rgba(0,0,0,.45), 0 16px 36px rgba(0,0,0,.45)">
    <p style="margin: 6px 0 2px; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #ABA298">Back cover</p>
    <button class="opt" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 16l5-5 4 4 3-3 4 4"></path></svg>Choose an image…</button>
    <button class="opt" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Photograph your copy</button>
    <button class="opt" role="menuitemradio" aria-checked="true" style="justify-content: space-between"><span style="display: flex; align-items: center; gap: 12px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2"></circle></svg>Use Miziki default</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button>
    <p style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: #ABA298">A square photo or scan works best. It syncs with your account, like a custom cover.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
