body{margin:0}

.cr button{color:#EFE9DF;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

.grooves{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,0) 1px 4px)}

      <div style="border-top: 1px solid rgba(239,233,223,.14); padding-top: 12px">

  <div style="position: absolute; left: 20px; right: 20px; top: 470px; display: flex; gap: 8px">
    <button class="pill" aria-pressed="true" style="border-color: #EFE9DF; background: rgba(239,233,223,.12)">Pinned to crate · #2</button>
    <button class="pill">Share record</button>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 532px">
    <p style="margin: 0; font-size: 12px; color: #ABA298">Well loved · since March 2025 · first spun at dusk</p>
  </div>

  <!-- pocket, unchanged from 01 -->
  <div style="position: absolute; left: 20px; right: 20px; top: 588px; height: 256px; overflow: hidden" aria-hidden="true">
    <div style="position: absolute; left: 50%; top: 0px; width: 176px; height: 176px; margin-left: -88px; border-radius: 50%; background: radial-gradient(circle at 50% 50%,rgba(0,0,0,.12),rgba(0,0,0,.45) 88%,rgba(0,0,0,.7) 100%), radial-gradient(circle,#8A2E2A 0 31%,#6B1F1C 31% 93%,#3E1210 93% 100%)">

      <div style="position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: #E9A24A; display: flex; align-items: center; justify-content: center"><div style="width: 7px; height: 7px; border-radius: 50%; background: #07080C"></div></div>
