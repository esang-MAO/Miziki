<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record share card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Antonio';src:url(/_blob/585dc45325db4fb5854071db9c78a376) format('woff2');font-weight:100 700}
@font-face{font-family:'Archivo';src:url(/_blob/8743631767b0a108de8776ce76e98669) format('woff2');font-weight:100 900}
@font-face{font-family:'Caveat';src:url(/_blob/05149a74360c53c909afa06bb93bd16f) format('woff2');font-weight:400 700}
@font-face{font-family:'IBM Plex Mono';src:url(/_blob/e5237619c7e70707876918173b2492b7) format('woff2');font-weight:400}
@font-face{font-family:'IBM Plex Mono';src:url(/_blob/4645d2e22e61db32e265c0d7172062d1) format('woff2');font-weight:500}
body{margin:0}
.grooves{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,0) 1px 4px)}
.fact{margin:0;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#ABA298}
.factv{margin:0 0 10px;font-family:'Archivo',sans-serif;font-size:16px;font-weight:500;color:#EFE9DF}
</style>
</helmet>
<div style="width: 540px; height: 540px; position: relative; overflow: hidden; background: linear-gradient(170deg,#1D2F38 0%,#101A20 62%,#07080C 100%); font-family: 'Archivo', sans-serif; color: #EFE9DF">

  <!-- the pressing, pulled part-way out -->
  <div style="position: absolute; left: 150px; top: 40px; width: 250px; height: 250px; border-radius: 50%; background: radial-gradient(circle at 50% 50%,rgba(0,0,0,.12),rgba(0,0,0,.45) 88%,rgba(0,0,0,.7) 100%), radial-gradient(circle,#8A2E2A 0 31%,#6B1F1C 31% 93%,#3E1210 93% 100%); box-shadow: 0 16px 36px rgba(0,0,0,.45)" aria-hidden="true">
    <div class="grooves"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%; background: #E9A24A; display: flex; align-items: center; justify-content: center"><div style="width: 9px; height: 9px; border-radius: 50%; background: #07080C"></div></div>
  </div>

  <!-- the jacket: real cover art now travels with the card -->
  <div style="position: absolute; left: 40px; top: 40px; width: 250px; height: 250px; border-radius: 3px; overflow: hidden; box-shadow: 0 2px 4px rgba(0,0,0,.45), 0 16px 36px rgba(0,0,0,.45); background: linear-gradient(180deg,#3F8C7E 0%,#2B5586 100%)" role="img" aria-label="Cover art, Low Tide Hymnal">
    <div style="position: absolute; left: 70px; top: 96px; width: 110px; height: 110px; border-radius: 50%; background: #F4F1E9"></div>
    <div style="position: absolute; left: 0; right: 0; top: 150px; bottom: 0; background: repeating-linear-gradient(180deg,#2B5586 0 6px,#1F3F66 6px 12px)"></div>
    <p style="position: absolute; left: 16px; top: 14px; margin: 0; font-family: 'Antonio', sans-serif; font-size: 16px; letter-spacing: .08em; color: #F4F1E9">THE MARRAM GRASS</p>
    <!-- friends sticker on the jacket -->
    <div style="position: absolute; right: 12px; bottom: 12px; width: 60px; height: 60px; border-radius: 50%; background: #E8D9A8; color: #26202C; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-8deg); box-shadow: 0 2px 4px rgba(0,0,0,.35)">
      <span style="font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; line-height: .9">3</span>
      <span style="font-family: 'Caveat', cursive; font-size: 16px; line-height: 1">friends</span>
    </div>
  </div>

  <!-- the pressing's facts column -->
  <div style="position: absolute; left: 420px; top: 52px; width: 100px">
    <p class="fact">PRESSING</p><p class="factv">Oxblood</p>
    <p class="fact">SPEED</p><p class="factv">33⅓</p>
    <p class="fact">FORMAT</p><p class="factv">12″ LP</p>
    <p class="fact">RATING</p><p class="factv" style="letter-spacing: 2px">★★★★</p>
  </div>

  <!-- record block -->
  <div style="position: absolute; left: 40px; right: 40px; top: 316px">
    <h2 style="margin: 0; font-family: 'Antonio', sans-serif; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -.015em">Low Tide Hymnal</h2>
    <p style="margin: 6px 0 0; font-size: 16px; color: rgba(239,233,223,.85)">The Marram Grass · 2024</p>
  </div>
  <div style="position: absolute; left: 44px; top: 410px; width: 300px; background: #F4F1E9; border-radius: 2px; transform: rotate(-1.5deg); box-shadow: 0 2px 6px rgba(0,0,0,.4)">
    <div style="position: absolute; left: 20px; top: -8px; width: 56px; height: 16px; background: rgba(232,217,168,.85); transform: rotate(-3deg)"></div>
    <p style="margin: 0; padding: 12px 14px; font-family: 'Caveat', cursive; font-size: 24px; line-height: 1.05; color: #26202C">Play it when the tide’s out and the windows are open.</p>
  </div>

  <!-- footer -->
  <p style="position: absolute; right: 40px; bottom: 26px; margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #ABA298">[your crate] · miziki</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":540}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
