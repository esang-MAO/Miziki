<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing share card, story</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&amp;family=Archivo:ital,wght@0,400;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Archivo,sans-serif;color:#EFE9DF}
.mono{font-family:'IBM Plex Mono',monospace}
.disc{position:absolute;border-radius:50%;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.disc::before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 0 3px,rgba(255,255,255,.055) 3px 4px)}
.disc::after{content:'';position:absolute;left:50%;top:50%;width:32%;height:32%;margin:-16% 0 0 -16%;border-radius:50%;background:#FF9E2C;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chip{display:inline-flex;align-items:center;height:23px;padding:0 11px;border-radius:12px;border:1px solid rgba(239,233,223,.32);background:rgba(255,255,255,.05);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.chip.filled{border-color:#FF9E2C;background:#FF9E2C;color:#171310}
</style>
</helmet>
<div style="width: 540px; height: 960px; box-sizing: border-box; position: relative; overflow: hidden; background: linear-gradient(180deg, #1D2F38 0%, #101A20 55%, #07080C 100%); display: flex; flex-direction: column; align-items: center; padding: 125px 32px 0">

  <!-- jacket with the record peeking out to the left, in its real pressing -->
  <div style="position: relative; width: 320px; height: 280px; margin: 0 0 36px 0; flex-shrink: 0">
    <div class="disc" aria-hidden="true" style="left: 0; top: 0; width: 280px; height: 280px; background: radial-gradient(circle at 50% 50%, #3660BE 0%, #2A4FA0 60%, #172B5C 100%)"></div>
    <div role="img" aria-label="Album cover placeholder" style="position: absolute; left: 60px; top: 0; width: 280px; height: 280px; border-radius: 3px; background: #6B4A3A; box-shadow: 0 10px 30px rgba(0,0,0,.6); display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box">
      <span style="font-family: Antonio, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .12em; color: rgba(239,233,223,.55)">[COVER]</span>
    </div>
  </div>

  <!-- title band: kicker, title (max 2 lines), artist, album · year -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; width: 476px">
    <div class="mono" style="font-size: 12px; font-weight: 600; letter-spacing: .14em; color: #FF9E2C">NOW PLAYING</div>
    <div style="font-size: 34px; font-weight: 700; line-height: 1.08; letter-spacing: -.01em; margin: 2px 0 0 0">[Song title that may run to two lines]</div>
    <div style="font-size: 17px; color: #B9C2C6; margin-top: 2px">[Artist]</div>
    <div class="mono" style="font-size: 11px; font-weight: 600; letter-spacing: .08em; color: #94A0A6">[ALBUM] · [YEAR]</div>
  </div>

  <!-- progress line with the clock beneath it -->
  <div style="width: 476px; margin-top: 40px; display: flex; flex-direction: column; gap: 10px">
    <div style="position: relative; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08)">
      <div style="position: absolute; left: 0; top: 0; height: 3px; width: 46%; border-radius: 2px; background: #FF9E2C"></div>
      <div style="position: absolute; left: 46%; top: -3px; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: #FF9E2C"></div>
    </div>
    <div class="mono" style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; color: #94A0A6">
      <span>2:23</span><span>5:12</span>
    </div>
  </div>

  <!-- spec chips: wrap to a second row when there are three -->
  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 476px; margin-top: 30px">
    <span class="chip">FLAC · 44.1 kHz · 16-bit</span>
    <span class="chip filled">VINYL</span>
    <span class="chip">SPUN AT DUSK</span>
  </div>

  <!-- brand footer, pinned to the story safe zone -->
  <div style="position: absolute; left: 0; right: 0; bottom: 118px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="font-family: Antonio, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .02em">Mi<span style="color: #FF9E2C">zi</span>ki</div>
    <div class="mono" style="font-size: 9px; font-weight: 600; letter-spacing: .14em; color: #94A0A6">LOCAL · LOSSLESS · NO STREAMING</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
