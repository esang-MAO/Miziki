<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player in One record mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&amp;family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0B13}
a{color:#FF9E2C}a:hover{color:#FFB85E}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:rgba(239,233,223,.16);position:relative;margin:0;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#EFE9DF;transition:left .2s}
.sw:checked{background:#FF9E2C}
.sw:checked::after{left:21px;background:#2A1B38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1E1828 0%, #0D0B13 100%); font-family: 'Archivo', system-ui, sans-serif; color: #EFE9DF; display: flex; flex-direction: column; padding: 16px 16px 24px">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button type="button" aria-label="Close player" style="width: 44px; height: 44px; background: none; border: 0; color: #94A0A6; font-size: 18px">⌄</button>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #94A0A6">Side A</span>
    <span style="width: 44px"></span>
  </div>

  <div style="position: relative; width: 300px; height: 300px; margin: 16px auto 0; border-radius: 12px; background: #1C1A1F; box-shadow: inset 0 1px 0 #2A272C, 0 4px 8px rgba(0,0,0,.25), 0 24px 48px rgba(0,0,0,.45)">
    <div aria-hidden="true" style="position: absolute; left: 18px; top: 18px; width: 264px; height: 264px; border-radius: 50%; background: repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.25) 0 1px, transparent 1px 5px), radial-gradient(circle at 38% 32%, #26282F, #15161B 55%, #0D0E13 100%); box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset"></div>
    <div aria-hidden="true" style="position: absolute; left: 115px; top: 115px; width: 70px; height: 70px; border-radius: 50%; background: #8578AE; display: flex; align-items: center; justify-content: center">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #1C1A1F"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; right: 30px; top: 14px; width: 5px; height: 150px; border-radius: 3px; background: linear-gradient(#C9C2B8, #8E877E); transform-origin: top center; transform: rotate(26deg)"></div>
    <div aria-hidden="true" style="position: absolute; right: 18px; top: 6px; width: 24px; height: 24px; border-radius: 50%; background: #2A272C; box-shadow: inset 0 1px 0 #3A363C"></div>
  </div>

  <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 44px; line-height: 1; letter-spacing: -.015em">[Album title]</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.35; color: rgba(239,233,223,.85)">[Artist] · [Track 3 title]</p>
  </div>

  <label style="margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(239,233,223,.07)">
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; line-height: 1.35">This record only</span>
      <span style="font-size: 14px; line-height: 1.45; color: #94A0A6">Your queue waits. When this side ends, playback stops.</span>
    </span>
    <input class="sw" type="checkbox" role="switch" checked>
  </label>

  <ol style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column">
    <li style="display: flex; gap: 12px; padding: 7px 0; font-size: 14px; line-height: 1.45; color: #94A0A6"><span style="font-family: 'IBM Plex Mono', monospace; width: 22px">A1</span><span style="flex: 1">[Track 1]</span></li>
    <li style="display: flex; gap: 12px; padding: 7px 0; font-size: 14px; line-height: 1.45; color: #94A0A6"><span style="font-family: 'IBM Plex Mono', monospace; width: 22px">A2</span><span style="flex: 1">[Track 2]</span></li>
    <li aria-current="true" style="display: flex; gap: 12px; padding: 7px 0; font-size: 14px; line-height: 1.45; color: #EFE9DF; font-weight: 600"><span style="font-family: 'IBM Plex Mono', monospace; width: 22px; font-weight: 500">A3</span><span style="flex: 1">[Track 3]</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; color: #94A0A6">2:41</span></li>
    <li style="display: flex; gap: 12px; padding: 7px 0; font-size: 14px; line-height: 1.45; color: rgba(239,233,223,.85)"><span style="font-family: 'IBM Plex Mono', monospace; width: 22px">A4</span><span style="flex: 1">[Track 4]</span></li>
    <li style="display: flex; gap: 12px; padding: 7px 0; font-size: 14px; line-height: 1.45; color: rgba(239,233,223,.85)"><span style="font-family: 'IBM Plex Mono', monospace; width: 22px">A5</span><span style="flex: 1">[Track 5]</span></li>
  </ol>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 40px">
    <button type="button" aria-label="Previous" style="width: 44px; height: 44px; background: none; border: 0; color: #EFE9DF; font-size: 20px">⏮</button>
    <button type="button" aria-label="Pause" style="width: 72px; height: 72px; border-radius: 50%; border: 0; background: #FF9E2C; color: #2A1B38; font-size: 22px; box-shadow: 0 2px 4px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35)">❚❚</button>
    <button type="button" aria-label="Next track" style="width: 44px; height: 44px; background: none; border: 0; color: #EFE9DF; font-size: 20px">⏭</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
