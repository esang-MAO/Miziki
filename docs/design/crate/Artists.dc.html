<span style="font-size: 14px; line-height: 1.4; color: #94A0A6">{{a.sub}}</span>

</sc-for>
<li style="position: sticky; top: 0; padding: 4px 0; display: flex; align-items: center; gap: 8px"><span class="disp" style="font-size: 20px; font-weight: 700; color: #94A0A6">B</span><span style="flex-grow: 1; height: 1px; background: rgba(239,233,223,.14); display: block"></span></li>
<li style="display: flex; align-items: center; gap: 14px; height: 72px">
<span aria-hidden="true" style="width: 64px; height: 56px; position: relative; flex-shrink: 0; display: block">
<span style="position: absolute; left: 0; top: 10px; width: 44px; height: 44px; border-radius: 3px; background: #665A44; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35); display: block"></span>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
<span style="font-size: 16px; font-weight: 600; line-height: 1.35">[Artist]</span>
<span style="font-size: 14px; line-height: 1.4; color: #94A0A6">1 record · 2003</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A868C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</li>
