<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Records count line and empty state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&amp;family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C10}
a{color:#FF9E2C}a:hover{color:#FFB85E}
</style>
</helmet>
<div style="width: 820px; height: 380px; box-sizing: border-box; background: #0B0C10; font-family: 'Archivo', system-ui, sans-serif; color: #EFE9DF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px">

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #94A0A6">Today</span>
    <div style="flex: 1; border-radius: 12px; background: linear-gradient(180deg, #1D2F38 0%, #101A20 60%); padding: 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.05">Records</h2>
        <span style="font-size: 14px; color: #94A0A6">40 records · 22 pressings · 9 metals</span>
      </div>
      <div style="padding: 16px; border-radius: 12px; border: 1px dashed rgba(239,233,223,.2); display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #94A0A6">Pressings · nothing yet</span>
        <span style="font-size: 14px; line-height: 1.45; color: rgba(239,233,223,.85)">Play an album through on a lossless file to unlock its pressing. Keep playing it to earn metals.</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #EFE9DF">Proposed</span>
    <div style="flex: 1; border-radius: 12px; background: linear-gradient(180deg, #1D2F38 0%, #101A20 60%); padding: 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.05">Records</h2>
        <span style="font-size: 14px; color: #94A0A6">40 records</span>
      </div>
      <div style="padding: 16px; border-radius: 12px; border: 1px dashed rgba(239,233,223,.2); display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #94A0A6">Pressings · nothing yet</span>
        <span style="font-size: 14px; line-height: 1.45; color: rgba(239,233,223,.85)">Pressings and metals show up here as you listen.</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":380}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
