<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sundown sheet, full, Sound</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Archivo:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.disp{font-family:'Antonio','Arial Narrow',sans-serif}
a{color:#FF9E2C}a:hover{color:#FFB85E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0B10; color: #EFE9DF; font-family: 'Archivo', 'Helvetica Neue', sans-serif; position: relative; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(170deg, #352A24 0%, #1A1310 62%, #0D0B10 100%); opacity: .45"></div>

<section role="dialog" aria-labelledby="sdSoundTitle" style="position: absolute; left: 0; right: 0; bottom: 0; top: 48px; border-radius: 12px 12px 0 0; background: #1E1815; border-top: 1px solid rgba(239,233,223,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 -10px 40px rgba(0,0,0,.45); padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 16px">

<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: rgba(239,233,223,.25); display: block"></span>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="sdSoundTitle" class="disp" style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase">Sundown</h2>
<div role="tablist" aria-label="Sundown view" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 160px; border: 1px solid rgba(239,233,223,.14); border-radius: 4px; overflow: hidden">
<a href="SheetDay.dc.html" role="tab" aria-selected="false" class="mono" style="min-height: 36px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #A99C8F; font-size: 11px; letter-spacing: .08em">DAY</a>
<a href="SheetSound.dc.html" role="tab" aria-selected="true" class="mono" style="min-height: 36px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: rgba(255,158,44,.14); color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">SOUND</a>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span class="mono" style="font-size: 10px; letter-spacing: .10em; color: #857A70">VINYL · 7:32 PM</span>
<span class="disp" style="font-size: 28px; font-weight: 700; line-height: 1.05; letter-spacing: .02em; text-transform: uppercase">Warming</span>
<span style="font-size: 14px; line-height: 1.45; color: #A99C8F">A touch warmer as the evening comes on.</span>
</div>

<div role="radiogroup" aria-label="Starting point" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button role="radio" aria-checked="false" style="min-height: 72px; border: 1px solid rgba(239,233,223,.14); border-radius: 12px; background: rgba(239,233,223,.07); color: #EFE9DF; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left">
<span style="font-size: 14px; font-weight: 600">Light dust</span><span style="font-size: 12px; color: #A99C8F">Barely there</span>
</button>
<button role="radio" aria-checked="true" style="min-height: 72px; border: 1px solid #FF9E2C; border-radius: 12px; background: rgba(255,158,44,.14); color: #EFE9DF; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left">
<span style="font-size: 14px; font-weight: 600">Classic press</span><span style="font-size: 12px; color: #A99C8F">Warm, steady</span>
</button>
<button role="radio" aria-checked="false" style="min-height: 72px; border: 1px solid rgba(239,233,223,.14); border-radius: 12px; background: rgba(239,233,223,.07); color: #EFE9DF; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left">
<span style="font-size: 14px; font-weight: 600">Well-played</span><span style="font-size: 12px; color: #A99C8F">Wobble, grit</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h3 class="mono" style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .08em; color: #A99C8F">DRIFT THROUGH THE DAY</h3>
<div role="radiogroup" aria-label="Drift through the day" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid rgba(239,233,223,.14); border-radius: 4px">
<button role="radio" aria-checked="false" class="mono" style="min-height: 44px; border: 0; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">OFF</button>
<button role="radio" aria-checked="true" class="mono" style="min-height: 44px; border: 1px solid #FF9E2C; border-radius: 4px; background: rgba(255,158,44,.14); color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">SUBTLE</button>
<button role="radio" aria-checked="false" class="mono" style="min-height: 44px; border: 0; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">FULL</button>
</div>
<svg width="358" height="44" viewBox="0 0 358 44" role="img" aria-label="Tone today: brighter in the morning, warmest at night" style="display: block">
<path d="M0 36 C 44 38, 66 20, 104 12 S 176 15, 220 21 S 286 38, 318 39 S 352 37, 358 36" fill="none" stroke="#EFE9DF" stroke-width="1.6"></path>
<circle cx="292" cy="35" r="4.5" fill="#FF9E2C"></circle>
</svg>
</div>

<div style="display: flex; flex-direction: column; border-top: 1px solid rgba(239,233,223,.14)">
<button aria-expanded="true" style="min-height: 48px; border: 0; background: transparent; color: #EFE9DF; padding: 0; display: flex; align-items: center; justify-content: space-between; text-align: left">
<span style="font-size: 16px; font-weight: 600">Advanced</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A99C8F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
</button>
<sc-for list="{{sliders}}" as="s" hint-placeholder-count="4">
<label style="min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 8px">
<span style="display: flex; justify-content: space-between"><span style="font-size: 14px">{{s.name}}</span><span class="mono" style="font-size: 10px; letter-spacing: .10em; color: #A99C8F">{{s.word}} · {{s.v}}</span></span>
<span style="height: 4px; border-radius: 2px; background: rgba(239,233,223,.14); position: relative; display: block">
<span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{s.pct}}; border-radius: 2px; background: rgba(255,158,44,.45); display: block"></span>
<span style="position: absolute; left: {{s.pct}}; top: -6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 8px; background: #EFE9DF; box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25); display: block"></span>
</span>
</label>
</sc-for>
</div>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sliders = [
['Wow & flutter', 'SLIGHT', 30],
['Saturation', 'CLEAN', 35],
['Top end', 'OPEN', 40],
['Squeeze', 'STEADY', 35]
].map((r) => ({ name: r[0], word: r[1], v: r[2], pct: r[2] + '%' }));
return { sliders };
}
}
</script>
</body>
</html>
