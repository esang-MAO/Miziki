<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library with three tabs and the sun on the mini-player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Archivo:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.disp{font-family:'Antonio','Arial Narrow',sans-serif}
a{color:#FF9E2C}a:hover{color:#FFB85E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #352A24 0%, #1A1310 62%, #0D0B10 100%); color: #EFE9DF; font-family: 'Archivo', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 8px 16px">
<div role="tablist" aria-label="Library view" style="display: flex; gap: 16px">
<button role="tab" aria-selected="false" class="mono" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">SONGS</button>
<button role="tab" aria-selected="true" class="mono" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid #FF9E2C; background: transparent; color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">CRATE</button>
<button role="tab" aria-selected="false" class="mono" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">ARTISTS</button>
<button role="tab" aria-selected="false" class="mono" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">PLAYLISTS</button>
</div>
<div style="display: flex">
<button aria-label="Search" style="width: 40px; height: 44px; border: 0; background: transparent; color: #A99C8F; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
</button>
<button aria-label="Add music" style="width: 40px; height: 44px; border: 0; background: transparent; color: #A99C8F; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<button aria-label="More: select, library tools" style="width: 40px; height: 44px; border: 0; background: transparent; color: #A99C8F; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
</button>
</div>
</div>

<div aria-hidden="true" style="flex-grow: 1; position: relative; display: flex; justify-content: center">
<span style="position: absolute; top: 40px; width: 220px; height: 52px; border-radius: 4px 4px 0 0; background: #4E4E62; display: block; transform: perspective(600px) rotateX(55deg); transform-origin: bottom"></span>
<span style="position: absolute; top: 70px; width: 240px; height: 56px; border-radius: 4px 4px 0 0; background: #5A4A5E; display: block; transform: perspective(600px) rotateX(50deg); transform-origin: bottom"></span>
<span style="position: absolute; top: 104px; width: 260px; height: 260px; border-radius: 4px; background: #3E5566; display: block; box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 4px 8px rgba(0,0,0,.25), 0 24px 48px rgba(0,0,0,.45)"></span>
<span style="position: absolute; top: 384px; width: 280px; height: 40px; border-radius: 0 0 4px 4px; background: #665A44; display: block; transform: perspective(600px) rotateX(-50deg); transform-origin: top"></span>
<span style="position: absolute; top: 410px; width: 296px; height: 36px; border-radius: 0 0 4px 4px; background: #44605A; display: block; transform: perspective(600px) rotateX(-55deg); transform-origin: top"></span>
</div>

<div style="padding: 0 24px 16px; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="disp" style="font-size: 24px; font-weight: 700; letter-spacing: .02em">[Album title]</span>
<span class="mono" style="font-size: 10px; letter-spacing: .10em; color: #857A70">[GENRE] · [YEAR] · 10 TRACKS</span>
</div>
<button aria-label="Play album" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #FF9E2C; color: #2A1B38; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
</button>
</div>

<div style="margin: 0 8px 8px; padding: 8px; border-radius: 12px; background: rgba(13,11,16,.9); box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25); display: flex; align-items: center; gap: 8px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: repeating-radial-gradient(circle, #15161B 0px, #15161B 2px, #1C1D23 3px); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FF9E2C; display: block"></span></span>
<span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1; padding-left: 4px">
<span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Track title]</span>
<span style="font-size: 12px; color: #857A70">[Artist]</span>
</span>
<a href="SheetDay.dc.html" aria-label="Sundown: golden hour, full speed. Open Sundown" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #FFB85E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 6v3M5.6 10.6l1.8 1.8M18.4 10.6l-1.8 1.8"></path></svg>
</a>
<button aria-label="Queue" style="width: 36px; height: 44px; border: 0; background: transparent; color: #A99C8F; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h12M4 12h12M4 17h8M19 14v6M16 17h6"></path></svg>
</button>
<button aria-label="Pause" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EFE9DF; color: #1A1310; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>
</button>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: rgba(13,11,16,.9); border-top: 1px solid rgba(239,233,223,.14); padding-bottom: 20px">
<a href="SheetLibrary.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; border-top: 2px solid #FF9E2C; margin-top: -1px; text-decoration: none; color: #EFE9DF">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF9E2C" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="5" height="14" rx="1"></rect><rect x="10" y="5" width="5" height="14" rx="1"></rect><path d="M17 6l3.5 12.5"></path></svg>
<span class="mono" style="font-size: 11px; font-weight: 500; letter-spacing: .08em">LIBRARY</span>
</a>
<a href="HomeSignedOut.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; border-top: 2px solid transparent; margin-top: -1px; text-decoration: none; color: #A99C8F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="opacity: .8"><path d="M4 10l8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>
<span class="mono" style="font-size: 11px; letter-spacing: .08em">HOME</span>
</a>
<a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; border-top: 2px solid transparent; margin-top: -1px; text-decoration: none; color: #A99C8F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="opacity: .8"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>
<span class="mono" style="font-size: 11px; letter-spacing: .08em">PROFILE</span>
</a>
</nav>

</div>
</x-dc>

</body>
</html>
