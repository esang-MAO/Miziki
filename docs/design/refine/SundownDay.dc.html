<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sundown Day view, set once</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Archivo:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.disp{font-family:'Antonio','Arial Narrow',sans-serif}
a{color:#FF9E2C}a:hover{color:#FFB85E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #1D2F38 0%, #101A20 62%, #07080C 100%); color: #EFE9DF; font-family: 'Archivo', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div role="tablist" aria-label="Sundown view" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 16px 16px 0; border: 1px solid rgba(239,233,223,.14); border-radius: 4px; overflow: hidden">
<a href="SundownDay.dc.html" role="tab" aria-selected="true" class="mono" style="min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: rgba(255,158,44,.14); color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">DAY</a>
<a href="Sound.dc.html" role="tab" aria-selected="false" class="mono" style="min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #94A0A6; font-size: 11px; letter-spacing: .08em">SOUND</a>
</div>

<div style="display: flex; justify-content: center; padding: 24px 0 8px">
<div style="width: 300px; height: 300px; position: relative">
<span class="mono" style="position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .08em; color: #EFE9DF">12P</span>
<span class="mono" style="position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .08em; color: #EFE9DF">12A</span>
<span class="mono" style="position: absolute; top: 142px; right: -6px; font-size: 11px; letter-spacing: .08em; color: #EFE9DF">6P</span>
<span class="mono" style="position: absolute; top: 142px; left: -6px; font-size: 11px; letter-spacing: .08em; color: #EFE9DF">6A</span>
<div role="img" aria-label="24-hour dial. Now 6:44 PM, afternoon. Spin to preview any hour." style="position: absolute; top: 18px; left: 18px; width: 264px; height: 264px; border-radius: 132px; background: conic-gradient(from 0deg, #D8D3C9 0deg, #CBBD9C 30deg, #CBBD9C 70deg, #E8B67A 84deg, #D99A5A 100deg, #D99A5A 122deg, #8578AE 136deg, #8578AE 268deg, #CFA0AD 278deg, #98C2CE 290deg, #98C2CE 322deg, #D8D3C9 345deg); box-shadow: 0 2px 4px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35)">
<div style="position: absolute; top: 14px; left: 14px; width: 236px; height: 236px; border-radius: 118px; background: repeating-radial-gradient(circle at 50% 50%, #15161B 0px, #15161B 2px, #1C1D23 3px, #15161B 4px); display: flex; align-items: center; justify-content: center">
<div style="width: 112px; height: 112px; border-radius: 56px; background: #FF9E2C; color: #2A1B38; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span class="disp" style="font-size: 36px; font-weight: 700; line-height: 1">6:44</span>
<span class="mono" style="font-size: 10px; letter-spacing: .10em">PM</span>
</div>
</div>
<span style="position: absolute; left: 248px; top: 149px; width: 14px; height: 14px; border-radius: 7px; background: #EFE9DF; box-shadow: 0 0 0 3px rgba(16,26,32,.9), 0 0 12px rgba(255,184,94,.8); display: block"></span>
</div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding-bottom: 16px">
<span style="font-size: 12px; color: #94A0A6">Spin the record to preview any hour</span>
</div>

<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 4px">
<h1 class="disp" style="margin: 0; font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: .02em; text-transform: uppercase">Afternoon</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #94A0A6">Full speed · sunset <span style="color: #EFE9DF">8:10 PM</span>, in <span style="color: #EFE9DF">1h 25m</span></p>
</div>

<div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 8px">
<h2 class="mono" style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .08em; color: #94A0A6">HOW DEEP THE NIGHT GOES</h2>
<div role="radiogroup" aria-label="How deep the night goes" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid rgba(239,233,223,.14); border-radius: 4px">
<button role="radio" aria-checked="false" class="mono" style="min-height: 44px; border: 0; background: transparent; color: #94A0A6; font-size: 11px; letter-spacing: .08em">OFF</button>
<button role="radio" aria-checked="false" class="mono" style="min-height: 44px; border: 0; background: transparent; color: #94A0A6; font-size: 11px; letter-spacing: .08em">GENTLE</button>
<button role="radio" aria-checked="true" class="mono" style="min-height: 44px; border: 1px solid #FF9E2C; border-radius: 4px; background: rgba(255,158,44,.14); color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">MEDIUM</button>
<button role="radio" aria-checked="false" class="mono" style="min-height: 44px; border: 0; background: transparent; color: #94A0A6; font-size: 11px; letter-spacing: .08em">DEEP</button>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.45; color: #94A0A6">Settles at 0.80×, about 4 semitones down, by dusk. Back up at dawn. Vinyl only.</p>
</div>

<div style="flex-grow: 1"></div>

<div style="margin: 0 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<p style="margin: 0; font-size: 12px; line-height: 1.45; color: #94A0A6">Using a stand-in sunset of 8:10 PM.</p>
<button class="mono" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #FF9E2C; font-size: 11px; font-weight: 500; letter-spacing: .08em; white-space: nowrap">USE MY LOCATION</button>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(10,14,18,.9); border-top: 1px solid rgba(239,233,223,.14); padding-bottom: 20px">
<a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; border-top: 2px solid transparent; margin-top: -1px; text-decoration: none; color: #94A0A6">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="opacity: .8"><rect x="3" y="5" width="5" height="14" rx="1"></rect><rect x="10" y="5" width="5" height="14" rx="1"></rect><path d="M17 6l3.5 12.5"></path></svg>
<span class="mono" style="font-size: 11px; letter-spacing: .08em">LIBRARY</span>
</a>
<a href="HomeSignedOut.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; border-top: 2px solid transparent; margin-top: -1px; text-decoration: none; color: #94A0A6">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="opacity: .8"><path d="M4 10l8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>
<span class="mono" style="font-size: 11px; letter-spacing: .08em">HOME</span>
</a>
<a href="SundownDay.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; border-top: 2px solid #FF9E2C; margin-top: -1px; text-decoration: none; color: #EFE9DF">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF9E2C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 17h18M7 17a5 5 0 0 1 10 0M12 4v3M4.9 8.9l2.1 2.1M19.1 8.9L17 11"></path></svg>
<span class="mono" style="font-size: 11px; font-weight: 500; letter-spacing: .08em">SUNDOWN</span>
</a>
<a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; border-top: 2px solid transparent; margin-top: -1px; text-decoration: none; color: #94A0A6">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="opacity: .8"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>
<span class="mono" style="font-size: 11px; letter-spacing: .08em">PROFILE</span>
</a>
</nav>

</div>
</x-dc>

</html>
