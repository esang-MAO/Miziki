<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Background playback offer on return</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Archivo:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.disp{font-family:'Antonio','Arial Narrow',sans-serif}
a{color:#FF9E2C}a:hover{color:#FFB85E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #1D2F38 0%, #101A20 62%, #07080C 100%); color: #EFE9DF; font-family: 'Archivo', 'Helvetica Neue', sans-serif; position: relative; overflow: hidden">

<div aria-hidden="true" style="padding: 72px 16px 0; display: flex; flex-direction: column; opacity: .5">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; height: 64px">
<span style="width: 48px; height: 48px; border-radius: 4px; display: block; background: {{row.art}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">[Track title]</span><span style="font-size: 14px; color: #94A0A6">[Artist] · [Album]</span></span>
</div>
</sc-for>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(7,8,12,.55)"></div>

<section role="dialog" aria-labelledby="bgOfferTitle" style="position: absolute; left: 8px; right: 8px; bottom: 28px; padding: 24px; border-radius: 12px; background: #16232A; border: 1px solid rgba(239,233,223,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 4px 8px rgba(0,0,0,.25), 0 24px 48px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 16px">
<span style="width: 48px; height: 48px; border-radius: 24px; flex-shrink: 0; background: repeating-radial-gradient(circle, #15161B 0px, #15161B 2px, #1C1D23 3px); display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; border-radius: 9px; background: #94A0A6; display: block"></span></span>
<h2 id="bgOfferTitle" style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3">Music stopped when you left Miziki.</h2>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #94A0A6">Keep it playing in the background, with controls on the lock screen? Audio then goes through the browser's player, which may change the sample rate.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<button class="mono" style="min-height: 52px; border: 0; border-radius: 4px; background: #FF9E2C; color: #2A1B38; font-size: 11px; font-weight: 500; letter-spacing: .08em">TURN ON</button>
<button class="mono" style="min-height: 44px; border: 0; background: transparent; color: #94A0A6; font-size: 11px; letter-spacing: .08em">NOT NOW</button>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.45; color: #7A868C; text-align: center">Asked once. Change it any time in Settings › Playback.</p>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tints = ['#4A5A52', '#5A4A5E', '#3E5566', '#665A44', '#4E4E62', '#5E4A44', '#44605A', '#5A5A48'];
return { rows: tints.map((art) => ({ art })) };
}
}
</script>
</body>
</html>
