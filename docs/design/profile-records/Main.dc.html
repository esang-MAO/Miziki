<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile records, collapsed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Archivo:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:'Antonio','Arial Narrow',sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.cell{position:relative;padding-top:12px}
.slv{position:relative;z-index:1;width:100%;aspect-ratio:1/1;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 14px rgba(0,0,0,.35)}
.slv::after{content:'';position:absolute;inset:0;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,235,200,.22),inset 0 -2px 0 rgba(0,0,0,.25)}
.pk{position:absolute;left:12%;top:0;width:76%;aspect-ratio:1/1;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pk::after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.10) 2px 3px)}
.verd{background:radial-gradient(circle,#FF9E2C 0 15%,#3F8C7E 15% 18%,#5BAA99 18% 90%,#2A5E54 90% 100%)}
.swirl{background:radial-gradient(circle,#FF9E2C 0 15%,transparent 15% 90%,#1A1A22 90% 100%),linear-gradient(115deg,#2B4A7A 0%,#2B4A7A 30%,#B5433A 46%,#2B4A7A 60%,#B5433A 78%,#2B4A7A 100%)}
.split{background:radial-gradient(circle,#FF9E2C 0 15%,transparent 15% 92%,#1A1A22 92% 100%),linear-gradient(90deg,#C9A24A 50%,#3E5566 50%)}
.splat{background:radial-gradient(circle,#FF9E2C 0 15%,transparent 15%),radial-gradient(circle at 30% 30%,#EFE9DF 0 5%,transparent 6%),radial-gradient(circle at 72% 62%,#EFE9DF 0 4%,transparent 5%),radial-gradient(circle at 58% 24%,#B5433A 0 4%,transparent 5%),radial-gradient(circle at 26% 70%,#B5433A 0 3%,transparent 4%),#2B2622}
.gold{background:radial-gradient(circle,#2A1B38 0 15%,#7A4E12 15% 17%,transparent 17% 92%,#8A3A1E 92% 100%),linear-gradient(130deg,#7A4E12 0%,#D6AD3F 38%,#F7E7A8 46%,#D6AD3F 54%,#7A4E12 100%)}
.chip{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
a{color:#FF9E2C}a:hover{color:#FFB85E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #352A24 0%, #1A1310 62%, #0D0B10 100%); color: #EFE9DF; font-family: 'Archivo', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-direction: column; gap: 12px; opacity: .55; padding-top: 16px">
<span class="mono" style="font-size: 10px; letter-spacing: .10em; color: #A99C8F">STAFF PICKS — 6 OF 8</span>
<div style="display: flex; gap: 8px">
<div style="width: 64px; height: 64px; border-radius: 4px; background: #5A4A5E"></div>
<div style="width: 64px; height: 64px; border-radius: 4px; background: #44605A"></div>
<div style="width: 64px; height: 64px; border-radius: 4px; background: #5E4A44"></div>
<div style="width: 64px; height: 64px; border-radius: 4px; background: #4E4E62"></div>
<div style="width: 64px; height: 64px; border-radius: 4px; background: #6A5A3E"></div>
</div>
</div>

<section aria-labelledby="recHead" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="recHead" class="disp" style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .02em">Records</h2>
<span class="mono" style="font-size: 10px; letter-spacing: .10em; color: #A99C8F">[212] RECORDS · [9] PRESSINGS</span>
</div>
<button class="mono" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #EFE9DF; font-size: 11px; letter-spacing: .08em">SEE ALL ›</button>
</div>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<div class="cell"><span class="pk verd" aria-hidden="true"></span><div class="slv" style="background: #3E5566" role="img" aria-label="[Album], Verdigris pressing unlocked"></div></div>
<div class="cell"><div class="slv" style="background: #5A4A5E" role="img" aria-label="[Album]"></div></div>
<div class="cell"><span class="pk swirl" aria-hidden="true"></span><div class="slv" style="background: #44605A" role="img" aria-label="[Album], Woad and Madder pressing unlocked"></div></div>
<div class="cell"><div class="slv" style="background: #5E4A44" role="img" aria-label="[Album]"></div></div>
<div class="cell"><div class="slv" style="background: #4E4E62" role="img" aria-label="[Album]"></div></div>
<div class="cell"><div class="slv" style="background: #6A5A3E" role="img" aria-label="[Album]"></div></div>
<div class="cell"><span class="pk gold" aria-hidden="true"></span><div class="slv" style="background: #4A3E52" role="img" aria-label="[Album], Gold metal earned"></div></div>
<div class="cell"><div class="slv" style="background: #3E4E44" role="img" aria-label="[Album]"></div></div>
<div class="cell"><div class="slv" style="background: #5E5244" role="img" aria-label="[Album]"></div></div>
<div class="cell"><span class="pk split" aria-hidden="true"></span><div class="slv" style="background: #52444E" role="img" aria-label="[Album], split pressing unlocked"></div></div>
</div>

<p style="margin: 0; font-size: 12px; line-height: 1.45; color: #A99C8F">A record peeking out of its sleeve is a pressing you’ve unlocked.</p>

<button style="min-height: 44px; border: 1px solid rgba(239,233,223,.18); border-radius: 12px; background: rgba(255,255,255,.04); color: #EFE9DF; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; display: flex; align-items: center; justify-content: center; gap: 8px">SHOW ALL [212] RECORDS
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>

<button style="min-height: 56px; padding: 0 16px; border: 1px solid rgba(239,233,223,.12); border-radius: 12px; background: rgba(13,11,16,.55); color: #EFE9DF; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="display: flex; gap: 4px" aria-hidden="true"><span class="chip verd"></span><span class="chip swirl"></span><span class="chip split"></span><span class="chip splat"></span><span class="chip gold"></span></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">Pressings &amp; metals</span>
<span class="mono" style="font-size: 10px; letter-spacing: .10em; color: #A99C8F">COLORS [4] OF 40 · EFFECTS [5] OF 32 · [3] METALS</span>
</span>
<span class="mono" style="font-size: 14px; color: #A99C8F" aria-hidden="true">›</span>
</button>
</section>

</div>

<nav aria-label="Main" style="display: flex; justify-content: space-around; padding: 6px 0 22px; background: rgba(10,14,18,.9); border-top: 1px solid rgba(239,233,223,.14)">
<button class="mono" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">LIBRARY</button>
<button class="mono" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">HOME</button>
<button class="mono" aria-current="page" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">PROFILE</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
