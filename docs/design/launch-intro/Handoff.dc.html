<div style="width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #D9D6CF, #8A867E)"></div>
</div>
</div>
</div>

<span style="font-size: 16px; font-weight: 600">[Last-played album]</span>
<span style="font-size: 12px; color: #A99C8F">[Artist]</span>
</div>

<button class="mono" aria-current="page" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">LIBRARY</button>
<button class="mono" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">HOME</button>
<button class="mono" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">PROFILE</button>
