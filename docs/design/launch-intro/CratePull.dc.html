<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crate pull with pressing peek</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Archivo:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.slab{position:absolute;left:50%;border-radius:4px 4px 0 0;transform-origin:bottom;box-shadow:inset 0 1px 0 rgba(255,235,200,.16)}
.grooves{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.10) 2px 3px)}
a{color:#FF9E2C}a:hover{color:#FFB85E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #352A24 0%, #1A1310 62%, #0D0B10 100%); color: #EFE9DF; font-family: 'Archivo', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0 16px">
<div role="tablist" aria-label="Library view" style="display: flex; gap: 16px">
<button role="tab" aria-selected="false" class="mono" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">SONGS</button>
<button role="tab" aria-selected="true" class="mono" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid #FF9E2C; background: transparent; color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">CRATE</button>
<button role="tab" aria-selected="false" class="mono" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">ARTISTS</button>
<button role="tab" aria-selected="false" class="mono" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">PLAYLISTS</button>
</div>
</div>

<div style="padding: 0 16px">
<span class="mono" style="font-size: 10px; letter-spacing: .10em; color: #A99C8F">212 RECORDS · A–Z</span>
</div>

<div aria-label="Crate. The front record is being pulled up; its pressing slides out of the top of the sleeve." style="position: relative; height: 470px; margin-top: 8px; perspective: 900px; perspective-origin: 50% 20%">
<div aria-hidden="true" style="position: absolute; inset: 0">
<div class="slab" style="top: 70px; width: 266px; height: 40px; margin-left: -133px; background: #4E4E62; transform: rotateX(60deg)"></div>
<div class="slab" style="top: 98px; width: 272px; height: 44px; margin-left: -136px; background: #5E4A44; transform: rotateX(58deg)"></div>
<div class="slab" style="top: 130px; width: 276px; height: 48px; margin-left: -138px; background: #44605A; transform: rotateX(56deg)"></div>
<div class="slab" style="top: 164px; width: 278px; height: 52px; margin-left: -139px; background: #5A4A5E; transform: rotateX(54deg)"></div>
</div>

<div aria-hidden="true" style="position: absolute; left: 66px; top: 30px; width: 258px; height: 258px; border-radius: 50%; background: radial-gradient(circle, #FF9E2C 0 15%, #3F8C7E 15% 18%, #5BAA99 18% 90%, #2A5E54 90% 100%); box-shadow: 0 6px 16px rgba(0,0,0,.45)">
<span class="grooves" style="display: block"></span>
</div>

<div aria-hidden="true" style="position: absolute; left: 56px; top: 92px; width: 278px; height: 278px; border-radius: 4px; background: #3E5566; box-shadow: inset 0 1px 0 rgba(255,235,200,.3), inset 0 -3px 0 rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.25), 0 24px 48px rgba(0,0,0,.45)"></div>

<div aria-hidden="true" style="position: absolute; left: 70px; top: 400px; width: 250px; height: 16px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.4), transparent)"></div>
</div>

<div style="flex: 1 1 auto"></div>

<div style="display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: rgba(10,14,18,.9)">
<div style="width: 44px; height: 44px; border-radius: 4px; background: #5E4A44"></div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">[Now playing]</span>
<span style="font-size: 12px; color: #A99C8F">[Artist]</span>
</div>
<button aria-label="Play" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #FF9E2C; color: #2A1B38; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
</button>
</div>

<nav aria-label="Main" style="display: flex; justify-content: space-around; padding: 6px 0 22px; background: rgba(10,14,18,.9); border-top: 1px solid rgba(239,233,223,.14)">
<button class="mono" aria-current="page" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #EFE9DF; font-size: 11px; font-weight: 500; letter-spacing: .08em">LIBRARY</button>
<button class="mono" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">HOME</button>
<button class="mono" style="min-width: 88px; min-height: 44px; border: 0; background: transparent; color: #A99C8F; font-size: 11px; letter-spacing: .08em">PROFILE</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
