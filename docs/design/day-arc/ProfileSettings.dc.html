<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile settings with appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&amp;family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.disp{font-family:'Antonio','Arial Narrow',sans-serif}
.sec{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#94A0A6;margin:22px 0 8px;text-transform:uppercase}
.ap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ap button{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;padding:10px 8px;border:1px solid rgba(239,233,223,.14);border-radius:3px;background:transparent;color:#94A0A6;min-height:44px}
.ap button[aria-pressed="true"]{border-color:#FF9E2C;color:#EFE9DF;background:rgba(255,158,44,.12)}
.lnk{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(239,233,223,.14);color:#EFE9DF;text-decoration:none;font-size:14px}
.lnk span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#94A0A6}
</style>
</helmet>
<div style="width: 390px; height: 640px; box-sizing: border-box; background: linear-gradient(180deg, #1E1828 0%, #0D0B13 70%, #07080C 100%); color: #EFE9DF; font-family: 'Archivo', 'Helvetica Neue', sans-serif; padding: 18px; display: flex; flex-direction: column">
<a href="Rhythm.dc.html" class="mono" style="font-size: 10.5px; letter-spacing: .12em; color: #94A0A6; text-decoration: none; padding: 10px 0; align-self: flex-start">‹ PROFILE</a>
<h1 class="disp" style="margin: 4px 0 0; font-size: 30px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase">Settings</h1>

<section aria-label="Appearance">
<div class="sec">Appearance</div>
<div class="ap" role="group" aria-label="Theme">
<button aria-pressed="false">AUTO</button>
<button aria-pressed="false">LIGHT</button>
<button aria-pressed="false">DARK</button>
<button aria-pressed="true" aria-label="Nychthemeron: follows sunrise and sunset">NYCHTHEMERON</button>
</div>
<p style="font-size: 12px; color: #94A0A6; line-height: 1.55; margin: 10px 0 0">Nychthemeron follows the whole day and night: light from sunrise to sunset, dark from sunset to sunrise. Turns dark at 6:33 pm today.</p>
</section>

<section aria-label="More settings">
<div class="sec">Account &amp; privacy</div>
<a href="#" class="lnk">Account <span>@[HANDLE] ›</span></a>
<a href="#" class="lnk">Privacy <span>›</span></a>
<a href="#" class="lnk">Library tools <span>›</span></a>
<a href="#" class="lnk" style="border-bottom: 0">Privacy policy &amp; terms <span>›</span></a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
